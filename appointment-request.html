<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176344">
  <title>طلب موعد | عيادات أفضل عناية الاستشارية</title>
  <link rel="icon" href="./assets/icons/icon-192.png">
  <style>
    @font-face{font-family:BCArabic;src:url("./assets/fonts/IBMPlexSansArabic-Regular.ttf")}@font-face{font-family:BCArabic;src:url("./assets/fonts/IBMPlexSansArabic-Bold.ttf");font-weight:700 950}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;padding:clamp(18px,4vw,52px);font-family:BCArabic,Tahoma,Arial,sans-serif;color:#193f31;background:radial-gradient(circle at 85% 0,#d9f0e4 0,transparent 34%),linear-gradient(145deg,#fbfdfc,#eef6f2)}
    main{width:min(720px,100%);margin:auto}.card{overflow:hidden;border:1px solid #d3e5dc;border-radius:30px;background:rgba(255,255,255,.96);box-shadow:0 26px 70px rgba(20,77,55,.14)}
    header{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:18px;padding:26px 28px;background:linear-gradient(135deg,#14543d,#26815d);color:#fff}header img{width:88px;height:88px;padding:8px;border-radius:24px;background:#fff;object-fit:contain}h1,p{margin:0}h1{font-size:clamp(24px,5vw,36px)}header p{margin-top:7px;color:#d8efe5;line-height:1.7}
    form{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:26px 28px}.intro{grid-column:1/-1;padding:14px 16px;border:1px solid #c9e3d6;border-radius:16px;background:#f0f8f4;color:#315f4f;line-height:1.8}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:900}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;min-height:50px;padding:10px 12px;border:1px solid #cedfd7;border-radius:13px;background:#fff;color:#193f31}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid rgba(40,139,99,.17);border-color:#2e8d67}.consent{grid-column:1/-1;display:flex;gap:9px;align-items:flex-start;padding:12px;border-radius:13px;background:#fbfcfb;color:#506b60;font-size:11px;line-height:1.7}.consent input{width:18px;min-height:18px;margin-top:2px;accent-color:#176344}.hp{position:absolute!important;left:-10000px!important}
    button{grid-column:1/-1;min-height:54px;border:1px solid #176344;border-radius:15px;background:linear-gradient(135deg,#176344,#2b8b64);color:#fff;font-size:16px;font-weight:950;box-shadow:0 13px 28px rgba(23,99,68,.2);cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{grid-column:1/-1;display:none;padding:14px 16px;border-radius:14px;font-weight:800;line-height:1.7}.message.show{display:block}.message.ok{border:1px solid #95d5b5;background:#ebf9f1;color:#176344}.message.error{border:1px solid #e5adb6;background:#fff1f3;color:#9d2e41}footer{padding:0 28px 24px;color:#6c8178;font-size:10px;text-align:center}
    @media(max-width:620px){body{padding:12px}header{grid-template-columns:68px 1fr;padding:20px}header img{width:66px;height:66px;border-radius:18px}form{grid-template-columns:1fr;padding:20px}.field,.field.full,.intro,.consent,button,.message{grid-column:1}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <header><img src="./best-care-logo.png" alt="شعار عيادات أفضل عناية"><div><h1>طلب موعد</h1><p>عيادات أفضل عناية الاستشارية للأسنان</p></div></header>
    <form id="requestForm" novalidate>
      <p class="intro">أدخل بياناتك باختصار، وسيقوم فريق العيادة بالتواصل معك لتحديد أقرب موعد متاح للفحص والتشخيص، مع إعطاء الحالات العاجلة أولوية بحسب التقييم.</p>
      <label class="field">الاسم الكامل<input id="name" name="name" autocomplete="name" maxlength="80" required placeholder="اكتب الاسم"></label>
      <label class="field">رقم الجوال<input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" required placeholder="05xxxxxxxx"></label>
      <label class="field">رقم الهوية أو الإقامة<input id="identity" name="identity" inputmode="numeric" maxlength="10" required placeholder="10 أرقام"></label>
      <label class="field">الخدمة المطلوبة<select id="service" name="service" required><option value="examination">فحص وتشخيص</option><option value="pain">ألم أو حالة عاجلة</option><option value="restorative">حشوات وعلاج تحفظي</option><option value="root_canal">علاج عصب</option><option value="prosthodontics">تركيبات وعدسات</option><option value="implants">زراعة أسنان</option><option value="cosmetic">تجميل الأسنان والابتسامة</option><option value="cleaning">تنظيف الأسنان</option><option value="other">خدمة أخرى</option></select></label>
      <label id="serviceOtherField" class="field full" hidden>حدد الخدمة<input id="serviceOther" name="serviceOther" maxlength="100" placeholder="اكتب الخدمة المطلوبة"></label>
      <label class="field full">ملاحظة مختصرة (اختياري)<textarea id="note" name="note" maxlength="220" placeholder="صف المشكلة أو الوقت المناسب للتواصل"></textarea></label>
      <label class="hp" aria-hidden="true">Website<input id="website" name="website" tabindex="-1" autocomplete="off"></label>
      <label class="consent"><input id="consent" type="checkbox" required><span>أوافق على استخدام هذه البيانات للتواصل بخصوص طلب الموعد. هذه الصفحة لا تُستخدم للحالات الطبية الطارئة؛ عند الطوارئ اتصل بالجهة الطبية المختصة.</span></label>
      <button id="submitBtn" type="submit">إرسال طلب الموعد</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
    <footer>سيتم التعامل مع بياناتك ضمن نطاق تنسيق الموعد فقط.</footer>
  </section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),startedAt=Date.now(),source=new URLSearchParams(location.search).get('source')||'direct',form=$('requestForm'),button=$('submitBtn'),message=$('message');$('service').addEventListener('change',()=>{$('serviceOtherField').hidden=$('service').value!=='other'});form.addEventListener('submit',async event=>{event.preventDefault();message.className='message';if(!form.reportValidity())return;button.disabled=true;button.textContent='جارٍ إرسال الطلب…';try{const response=await fetch('/api/appointment-requests',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value,phone:$('phone').value,identity:$('identity').value,service:$('service').value,serviceOther:$('serviceOther').value,note:$('note').value,website:$('website').value,source,startedAt})});const data=await response.json();if(!response.ok)throw new Error(data.error||'تعذر إرسال الطلب');message.textContent='تم استلام طلبك. سيتم التواصل معك لتحديد أقرب موعد متاح للفحص والتشخيص، مع إعطاء الحالات العاجلة أولوية بحسب التقييم.';message.className='message show ok';form.reset();$('serviceOtherField').hidden=true;button.textContent='تم إرسال الطلب'}catch(error){message.textContent=error.message.includes('mobile')?'تحقق من رقم الجوال بصيغة 05xxxxxxxx.':error.message.includes('identity')?'تحقق من رقم الهوية أو الإقامة (10 أرقام).':'تعذر إرسال الطلب الآن. حاول مرة أخرى بعد قليل.';message.className='message show error';button.disabled=false;button.textContent='إرسال طلب الموعد'}})})();
</script>
</body>
</html>
