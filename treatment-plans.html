<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script src="./theme-boot.js"></script>
  <meta name="theme-color" content="#315f85">
  <title>مركز الخطط العلاجية | أفضل عناية</title>
  <link rel="icon" href="./assets/icons/icon-192.png">
  <style>
    @font-face{font-family:BCArabic;src:url("./assets/fonts/IBMPlexSansArabic-Regular.ttf");font-display:swap}@font-face{font-family:BCArabic;src:url("./assets/fonts/IBMPlexSansArabic-Bold.ttf");font-weight:700 950;font-display:swap}:root{--blue:#315f85;--ink:#193f57;--muted:#70838d;--line:#d6e3ea;--soft:#f2f7fa;--red:#b72c42;--gold:#c68e17;--green:#23815d}*{box-sizing:border-box}[hidden]{display:none!important}html{background:#edf4f7}body{margin:0;min-width:320px;min-height:100vh;font-family:BCArabic,Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f9fcfd,#edf4f7)}button,input,select{font:inherit}.shell{width:min(1380px,calc(100% - 28px));margin:auto;padding:18px 0 55px}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;padding:15px 17px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.95);box-shadow:0 13px 34px rgba(38,80,109,.12);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:13px}.brand img{width:58px;height:58px;padding:5px;border:1px solid var(--line);border-radius:17px;background:#fff;object-fit:contain}.brand h1,.brand p{margin:0}.brand h1{font-size:clamp(20px,3vw,30px)}.brand p{margin-top:3px;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 13px;border:1px solid #bfd2df;border-radius:12px;background:#fff;color:var(--blue);font-weight:900;text-decoration:none;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 7px 20px rgba(40,80,108,.06)}.stat span,.stat strong{display:block}.stat span{color:var(--muted);font-size:10px;font-weight:850}.stat strong{margin-top:4px;font-size:25px}.stat.pending{border-color:#ead6a0}.stat.approved{border-color:#b8dec8}.stat.identity{border-color:#edbec5}.status-legend{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px;padding:8px 10px;border:1px solid #dbe6eb;border-radius:13px;background:rgba(255,255,255,.85)}.status-legend span{display:inline-flex;align-items:center;gap:5px;color:#536b78;font-size:9px;font-weight:900}.status-legend i{width:10px;height:10px;border-radius:50%;background:var(--legend);box-shadow:0 0 0 3px color-mix(in srgb,var(--legend) 18%,transparent)}.legend-draft{--legend:#7890a0}.legend-submitted{--legend:#d29b22}.legend-patient{--legend:#397eaa}.legend-approved{--legend:#16847d}.legend-final{--legend:#1f8a5e}.legend-rejected{--legend:#c53249}.legend-cancelled{--legend:#59656c}.filters{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(2,minmax(150px,.8fr)) auto;gap:9px;margin-bottom:13px;padding:12px;border:1px solid var(--line);border-radius:17px;background:#fff}.filters input,.filters select{width:100%;min-height:43px;padding:8px 11px;border:1px solid #c7d8e2;border-radius:11px;background:#fff;color:var(--ink)}.list{display:grid;gap:10px}.card{--tone-bg:#fff;--tone-border:var(--line);--tone-bar:var(--blue);--tone-text:var(--blue);position:relative;display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(170px,.8fr) minmax(185px,.8fr) auto;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--tone-border);border-radius:17px;background:linear-gradient(145deg,var(--tone-bg),#fff 82%);box-shadow:0 8px 23px rgba(38,77,103,.07),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden}.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--tone-bar)}.card.status-draft{--tone-bg:#f4f7f9;--tone-border:#cdd8de;--tone-bar:#7890a0;--tone-text:#556e7d}.card.status-submitted{--tone-bg:#fff8e4;--tone-border:#ead08c;--tone-bar:#d29b22;--tone-text:#805d0c}.card.status-patient_accepted{--tone-bg:#edf7fc;--tone-border:#b5d5e7;--tone-bar:#397eaa;--tone-text:#285f82}.card.status-approved{--tone-bg:#eaf8f6;--tone-border:#a9dcd5;--tone-bar:#16847d;--tone-text:#12645f}.card.status-approved_signed{--tone-bg:#eaf8ef;--tone-border:#a8d9bb;--tone-bar:#1f8a5e;--tone-text:#176a47}.card.status-rejected{--tone-bg:#fff0f2;--tone-border:#e9acb6;--tone-bar:#c53249;--tone-text:#94283a}.card.status-cancelled{--tone-bg:#eef1f2;--tone-border:#bac4c9;--tone-bar:#59656c;--tone-text:#39474e}.card.zero{--tone-bg:#fff0f2;--tone-border:#e7a9b3;--tone-bar:var(--red);--tone-text:#992d40}.patient strong,.patient small,.clinic strong,.clinic small{display:block}.patient strong{color:var(--tone-text);font-size:16px}.patient small,.clinic small{margin-top:4px;color:var(--muted);font-size:10px}.clinic strong{color:var(--tone-text)}.warning,.cancel-note{display:inline-flex;margin-top:6px;padding:4px 7px;border:1px solid #efbec5;border-radius:999px;background:#fff0f2;color:#a42a3e;font-size:9px;font-weight:950}.cancel-note{border-color:#c8d0d4;background:#f2f4f5;color:#49575e}.status{display:grid;gap:4px;color:var(--tone-text);font-size:9px;font-weight:900}.status select{min-width:175px;padding:8px;border:1px solid var(--tone-border);border-radius:10px;background:rgba(255,255,255,.88);color:var(--tone-text);font-weight:900}.card-actions{display:flex;gap:6px}.card-actions button{min-height:38px;padding:8px 10px;border:1px solid var(--tone-border);border-radius:10px;background:rgba(255,255,255,.82);color:var(--tone-text);font-size:10px;font-weight:950;white-space:nowrap;cursor:pointer}.card-actions .danger{border-color:#ecc0c6;background:#fff2f3;color:var(--red)}.empty,.error{padding:42px;border:1px dashed #bfd2df;border-radius:18px;background:#fff;text-align:center;color:var(--muted)}.error{border-color:#e8b9c0;background:#fff5f6;color:#a12a3d}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.card{grid-template-columns:1fr 1fr}.card-actions{grid-column:1/-1}.card-actions button{flex:1}}@media(max-width:620px){.shell{width:calc(100% - 14px);padding-top:7px}.topbar{position:relative;padding:12px}.brand img{width:48px;height:48px}.brand h1{font-size:18px}.brand p{font-size:9px}.actions{display:grid}.btn{min-height:37px;padding:6px 9px;font-size:9px}.summary{gap:7px}.stat{padding:11px}.stat strong{font-size:21px}.status-legend{gap:6px;padding:7px}.filters{grid-template-columns:1fr;padding:9px}.filters input{grid-column:auto}.card{grid-template-columns:1fr;padding:13px 15px}.card-actions{grid-column:auto;display:grid;grid-template-columns:1fr 1fr}.status select{width:100%}}
  </style>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><img src="./best-care-logo.png" alt="شعار أفضل عناية"><div><h1>مركز الخطط العلاجية</h1><p>متابعة الاعتماد والتصحيح والسجل الدائم لكل مريض</p></div></div><div class="actions"><a class="btn" href="./?view=admin">العودة للإدارة</a><button id="refreshBtn" class="btn primary" type="button">تحديث</button></div></header>
  <section class="summary"><article class="stat"><span>إجمالي الخطط</span><strong id="totalCount">0</strong></article><article class="stat pending"><span>تحتاج إجراء</span><strong id="pendingCount">0</strong></article><article class="stat approved"><span>معتمدة وموقعة</span><strong id="approvedCount">0</strong></article><article class="stat identity"><span>رقم ملف يحتاج تصحيحًا</span><strong id="zeroCount">0</strong></article></section>
  <div class="status-legend" aria-label="دليل ألوان حالات الخطط"><span class="legend-draft"><i></i>مسودة</span><span class="legend-submitted"><i></i>لدى الإدارة</span><span class="legend-patient"><i></i>وافق المريض</span><span class="legend-approved"><i></i>معتمدة</span><span class="legend-final"><i></i>معتمدة وموقعة</span><span class="legend-rejected"><i></i>تحتاج تعديلًا</span><span class="legend-cancelled"><i></i>ملغاة</span></div>
  <section class="filters"><input id="searchInput" type="search" placeholder="بحث بالاسم أو الملف أو الجوال أو رقم الخطة"><select id="clinicFilter"><option value="all">جميع العيادات</option></select><select id="statusFilter"><option value="all">جميع الحالات</option><option value="unapproved">غير المعتمدة فقط</option><option value="cancelled">الخطط الملغاة</option></select><button id="clearFilters" class="btn" type="button">مسح التصفية</button></section>
  <p id="errorBox" class="error" hidden></p><section id="planList" class="list" aria-live="polite"><p class="empty">جارٍ تحميل الخطط العلاجية…</p></section>
</main>
<script src="./treatment-plans.js"></script>
</body>
</html>
